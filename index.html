`package com.university.management;
import java.util.Scanner;

interface ExamEligibility {
    boolean isEligibleForExam();
}
interface ScholarshipEligibility {
    boolean isEligibleForScholarship();
}

class Department {
    protected final String departmentName;
    protected static final String UNIVERSITY_NAME = "ABC University";
    public Department(String d) {
        this.departmentName = d;
    }
    public void displayDepartment() {
        System.out.println("University  : " + UNIVERSITY_NAME);
        System.out.println("Department  : " + departmentName);
    }
}

class Course extends Department {
    protected final String courseName;
    protected final int courseCode;
    public Course(String d, String c, int code) {
        super(d);
        this.courseName=c;
        this.courseCode=code;
    }
    public void displayCourse() {
        System.out.println("Course Name : " + courseName);
        System.out.println("Course Code : " + courseCode);
    }
}

class Student extends Course implements ExamEligibility, ScholarshipEligibility {
    private final int studentId;
    private final String studentName;
    private double marks, attendance, gpa;
    static int totalStudents = 0;

    public Student(int id, String nm, String dept, String crs, int code, double marks, double att) {
        super(dept, crs, code);
        if (marks < 0 || marks > 100) throw new IllegalArgumentException("Marks must be between 0 and 100.");
        if (att < 0 || att > 100)     throw new IllegalArgumentException("Attendance must be between 0 and 100.");
        this.studentId=id; this.studentName=nm;
        this.marks=marks; this.attendance=att;
        this.gpa=calculateGPA(); totalStudents++;
    }

    public double calculateGPA() {
        return marks / 10.0;
    }
    @Override public boolean isEligibleForExam() {
        return attendance >= 75;
    }
    @Override public boolean isEligibleForScholarship() {
        return gpa >= 8.5;
    }

    public void displayStudentDetails() {
        System.out.println("\\n========== STUDENT DETAILS ==========");
        displayDepartment(); displayCourse();
        System.out.println("Student ID  : " + studentId);
        System.out.println("Student Name: " + studentName);
        System.out.println("Marks       : " + marks);
        System.out.println("Attendance  : " + attendance + "%");
        System.out.println("GPA         : " + gpa);
        System.out.println("Exam        : " + (isEligibleForExam() ? "Eligible" : "Not Eligible"));
        System.out.println("Scholarship : " + (isEligibleForScholarship() ? "Eligible" : "Not Eligible"));
        System.out.println("=====================================");
    }
}

public class UniversityManagementSystem {
    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);

        do {
            System.out.println("\\n====== UNIVERSITY MANAGEMENT SYSTEM ======");

`package com.shopping.cart;
import java.util.*;

interface Discountable {
    double applyDiscount(double amt);
}

class Product {
    private final String name; private final int code;
    private final double price; private final int qty;
    static int totalProducts = 0;

    public Product(String n, int c, double p, int q) {
        if (p < 0) throw new IllegalArgumentException("Price cannot be negative.");
        if (q < 0) throw new IllegalArgumentException("Quantity cannot be negative.");
        this.name=n; this.code=c; this.price=p; this.qty=q; totalProducts++;
    }
    public String getName() {
        return name;
    }
    public double getPrice() {
        return price;
    }
    public int getQty() {
        return qty;
    }
    public void display() {
        System.out.println("Product: "+name+" | Code: "+code+" | Price: Rs."+price+" | Qty: "+qty);
    }
}

class Cart implements Discountable {
    private final List<Product> items = new ArrayList<>();
    private static final double DISC_RATE = 0.10;

    public void addProduct(Product p) {
        items.add(p);
        System.out.println(p.getName()+" added to cart.");
    }

    public double calcTotal() {
        double t = 0; for(Product p : items) t += p.getPrice()*p.getQty(); return t;
    }

    @Override public double applyDiscount(double amt) {
        return amt - (amt * DISC_RATE);
    }

    public void viewCart() {
        if(items.isEmpty()){ System.out.println("Cart is empty!"); return; }
        System.out.println("\\n===== CART ITEMS =====");
        for(Product p : items) p.display();
    }

    public void checkout() {
        if(items.isEmpty()){ System.out.println("Cart is empty!"); return; }
        double total = calcTotal(), payable = applyDiscount(total);
        System.out.println("\\n===== ORDER SUMMARY =====");
        for(Product p : items) p.display();
        System.out.println("Subtotal : Rs."+total);
        System.out.println("Discount : 10%");
        System.out.println("Payable  : Rs."+payable);
        System.out.println("=========================");
        items.clear(); System.out.println("Order Placed Successfully!");
    }
}

public class OnlineShoppingSystem {
    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in); Cart cart = new Cart(); int choice;
        do {
            System.out.println("\\n====== ONLINE SHOPPING SYSTEM ======");
            System.out.println("1. Add Product  2. View Cart  3. Checkout  4. Total Products  5. Exit");
            System.out.print("Enter Choice: "); choice = sc.nextInt();
            switch(choice) {
                case 1:
                    try {
                        sc.nextLine();
                        System.out.print("Name: "); String n=sc.nextLine();
                        System.out.print("Code: "); int c=sc.nextInt();
                        System.out.print("Price: "); double p=sc.nextDouble();
                        System.out.print("Qty: "); int q=sc.nextInt();
                        cart.addProduct(new Product(n,c,p,q));
                    } catch(IllegalArgumentException e){ System.out.println("Error: "+e.getMessage()); }
                      catch(Exception e){ System.out.println("Invalid Input!"); sc.nextLine(); }
                    break;
                case 2: cart.viewCart(); break;
                case 3: cart.checkout(); break;
                case 4: System.out.println("Total Products Created: "+Product.totalProducts); break;
                case 5: System.out.println("Exiting..."); break;
                default: System.out.println("Invalid Choice!");
            }
        } while(choice != 5);
        sc.close();
    }
}`

`package com.railway.reservation;
import java.util.*;

interface Reservable {
    boolean bookSeat(String passengerName);
    boolean cancelSeat(String passengerName);
}

class Train {
    protected final String trainName; protected final int trainNo;
    protected static final String RAILWAY = "Indian Railways";
    public Train(String n, int no) {
        this.trainName=n;
        this.trainNo=no;
    }
    public void displayTrain() {
        System.out.println("Railway   : " + RAILWAY);
        System.out.println("Train     : " + trainName + " (" + trainNo + ")");
    }
}

class Passenger extends Train {
    protected final String name; protected final int age; protected final String gender;
    public Passenger(String nm, int ag, String gn, String tn, int tno) {
        super(tn, tno);
        if(nm==null||nm.isEmpty()) throw new IllegalArgumentException("Name cannot be empty.");
        if(ag<1||ag>120) throw new IllegalArgumentException("Invalid age: "+ag);
        this.name=nm; this.age=ag; this.gender=gn;
    }
    public void displayPassenger() {
        displayTrain();
        System.out.println("Passenger : "+name+" | Age: "+age+" | Gender: "+gender);
    }
}

class Ticket extends Train implements Reservable {
    private final int totalSeats; private int availSeats;
    private final double fare;
    private final List<String> booked = new ArrayList<>();
    static int totalTickets = 0;

    public Ticket(String tn, int tno, int seats, double fare) {
        super(tn, tno);
        if(seats<=0) throw new IllegalArgumentException("Seats must be positive.");
        if(fare<0)   throw new IllegalArgumentException("Fare cannot be negative.");
        this.totalSeats=seats; this.availSeats=seats; this.fare=fare;
    }

    @Override public boolean bookSeat(String pName) {
        if(availSeats<=0){ System.out.println("Error: All seats are booked!"); return false; }
        booked.add(pName); availSeats--; totalTickets++;
        System.out.println("Seat booked for "+pName+". Fare: Rs."+fare);
        return true;
    }

    @Override public boolean cancelSeat(String pName) {
        if(!booked.contains(pName)){ System.out.println("Passenger not found in booking."); return false; }
        booked.remove(pName); availSeats++;
        System.out.println("Booking cancelled for "+pName+".");
        return true;
    }

    public void displayStatus() {
        displayTrain();
        System.out.println("Total Seats: "+totalSeats+" | Available: "+availSeats+" | Fare: Rs."+fare);
        System.out.println("Booked: "+booked);
    }
}

public class RailwayReservationSystem {
    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in); Ticket ticket = null; int choice;
        do {
            System.out.println("\\n====== RAILWAY RESERVATION SYSTEM ======");

            System.out.print("Enter Choice: "); choice = sc.nextInt();

                case 1:
                    try {
                        sc.nextLine();

                        ticket=new Ticket(tn,tno,s,f); System.out.println("Train setup done.");
                    } catch(IllegalArgumentException e){ System.out.println("Error: "+e.getMessage()); }
                    break;
                case 2:
                    if(ticket==null){ System.out.println("Setup train first!"); break; }
                    sc.nextLine(); System.out.print("Passenger Name: "); ticket.bookSeat(sc.nextLine()); break;
                case 3:
                    if(ticket==null){ System.out.println("Setup train first!"); break; }

`package com.company.hr;
import java.util.*;

interface Payable {
    double calculateSalary();
    void displayPayslip();
}

class Employee {
    protected final int empId; protected final String name; protected final String designation;
    protected static final String COMPANY = "XYZ Corporation";
    static int totalEmployees = 0;
    public Employee(int id, String nm, String desig) {
        if(nm==null||nm.isEmpty()) throw new IllegalArgumentException("Name cannot be empty.");
        this.empId=id; this.name=nm; this.designation=desig; totalEmployees++;
    }
    public void displayEmployee() {
        System.out.println("Company     : " + COMPANY);
        System.out.println("Emp ID      : " + empId);
        System.out.println("Name        : " + name);
        System.out.println("Designation : " + designation);
    }
}

class Manager extends Employee implements Payable {
    private final double basicSalary; private final int workingDays; private final double incentive;
    private static final double BONUS = 0.20;
    public Manager(int id, String nm, double basic, int days, double inc) {
        super(id, nm, "Manager");
        if(basic<0)  throw new IllegalArgumentException("Salary cannot be negative.");
        if(days<0)   throw new IllegalArgumentException("Working days cannot be negative.");
        this.basicSalary=basic; this.workingDays=days; this.incentive=inc;
    }
    @Override public double calculateSalary() {
        return (basicSalary/30.0)*workingDays + (basicSalary*BONUS) + incentive;
    }
    @Override public void displayPayslip() {
        System.out.println("\\n========== MANAGER PAYSLIP ==========");
        displayEmployee();
        System.out.printf("Basic Salary : Rs.%.2f%n", basicSalary);
        System.out.println("Working Days : " + workingDays);
        System.out.printf("Incentive    : Rs.%.2f%n", incentive);
        System.out.printf("Net Salary   : Rs.%.2f%n", calculateSalary());
        System.out.println("=====================================");
    }
}

class Clerk extends Employee implements Payable {
    private final double basicSalary; private final int workingDays;
    public Clerk(int id, String nm, double basic, int days) {
        super(id, nm, "Clerk");
        if(basic<0) throw new IllegalArgumentException("Salary cannot be negative.");
        if(days<0)  throw new IllegalArgumentException("Working days cannot be negative.");
        this.basicSalary=basic; this.workingDays=days;
    }
    @Override public double calculateSalary() {
        return (basicSalary/30.0)*workingDays;
    }
    @Override public void displayPayslip() {
        System.out.println("\\n========== CLERK PAYSLIP ==========");
        displayEmployee();
        System.out.printf("Basic Salary : Rs.%.2f%n", basicSalary);
        System.out.println("Working Days : " + workingDays);
        System.out.printf("Net Salary   : Rs.%.2f%n", calculateSalary());
        System.out.println("===================================");

`package com.library.system;
import java.util.*;

interface Borrowable {
    void issueBook(String memberId);
    void returnBook(String memberId);
}

class BookUnavailableException extends Exception {
    public BookUnavailableException(String msg) {
        super(msg);
    }
}
class FineCalculationException extends Exception {
    public FineCalculationException(String msg) {
        super(msg);
    }
}

class LibraryEntity {
    protected final String instituteName;
    protected static final String LIBRARY = "City Central Library";
    public LibraryEntity() {
        this.instituteName = LIBRARY;
    }
    public void displayLibrary() {
        System.out.println("Library: " + instituteName);
    }
}

class Book extends LibraryEntity implements Borrowable {
    private final int bookId; private final String title; private final String author;
    private boolean available = true;
    private final List<String> borrowedBy = new ArrayList<>();
    static int totalBooks = 0;

    public Book(int id, String t, String a) {
        if(t==null||t.isEmpty()) throw new IllegalArgumentException("Title cannot be empty.");
        this.bookId=id; this.title=t; this.author=a; totalBooks++;
    }

    @Override public void issueBook(String memberId) {
        try {
            if(!available) throw new BookUnavailableException("Book '"+title+"' is not available.");
            available=false; borrowedBy.add(memberId);
            System.out.println("Book '"+title+"' issued to Member: "+memberId);
        } catch(BookUnavailableException e){ System.out.println("Error: "+e.getMessage()); }
    }

    @Override public void returnBook(String memberId) {
        try {
            if(!borrowedBy.contains(memberId)) throw new FineCalculationException("Member "+memberId+" did not borrow this book.");
            borrowedBy.remove(memberId); available=true;
            System.out.println("Book '"+title+"' returned by Member: "+memberId+". Fine: Rs.0");
        } catch(FineCalculationException e){ System.out.println("Error: "+e.getMessage()); }
    }

    public void display() {
        displayLibrary();
        System.out.println("Book ID: "+bookId+" | Title: "+title+" | Author: "+author+" | Status: "+(available?"Available":"Issued"));
    }
}

class Member extends LibraryEntity {
    private final String memberId; private final String memberName;
    static int totalMembers = 0;
    public Member(String id, String nm) {
        if(nm==null||nm.isEmpty()) throw new IllegalArgumentException("Member name cannot be empty.");
        this.memberId=id; this.memberName=nm; totalMembers++;
    }
    public String getMemberId() {
        return memberId;
    }
    public void display() {
        displayLibrary();
        System.out.println("Member ID: "+memberId+" | Name: "+memberName);
    }
}

public class LibraryManagementSystem {
    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);
        List<Book> books=new ArrayList<>(); List<Member> members=new ArrayList<>(); int choice;
        do {
            System.out.println("\\n====== LIBRARY MANAGEMENT SYSTEM ======");
            System.out.println("1. Add Book  2. Add Member  3. Issue Book  4. Return Book  5. View All  6. Exit");
            System.out.print("Enter Choice: "); choice = sc.nextInt();
            switch(choice) {
                case 1:
                    try {
                        sc.nextLine();
                        System.out.print("Book ID: "); int id=sc.nextInt(); sc.nextLine();
                        System.out.print("Title: "); String t=sc.nextLine();
                        System.out.print("Author: "); String a=sc.nextLine();
                        books.add(new Book(id,t,a)); System.out.println("Book Added!");
                    } catch(IllegalArgumentException e){ System.out.println("Error: "+e.getMessage()); }
                    break;
                case 2:
                    try {
                        sc.nextLine();
                        System.out.print("Member ID: "); String mid=sc.nextLine();
                        System.out.print("Name: "); String nm=sc.nextLine();
                        members.add(new Member(mid,nm)); System.out.println("Member Added!");
                    } catch(IllegalArgumentException e){ System.out.println("Error: "+e.getMessage()); }
                    break;
                case 3:
                    sc.nextLine();
                    System.out.print("Enter Book ID: "); int bid=Integer.parseInt(sc.nextLine());
                    System.out.print("Enter Member ID: "); String mid=sc.nextLine();
                    books.stream().filter(b->b.hashCode()==bid||(books.indexOf(b)+1)==bid).findFirst().ifPresent(b->b.issueBook(mid));
                    if(!books.isEmpty()) books.get(bid-1).issueBook(mid);
                    break;
                case 4:
                    sc.nextLine();
                    System.out.print("Enter Book ID: "); int rid=Integer.parseInt(sc.nextLine());
                    System.out.print("Enter Member ID: "); String rmid=sc.nextLine();
                    if(rid>=1&&rid<=books.size()) books.get(rid-1).returnBook(rmid);
                    else System.out.println("Invalid Book ID!");
                    break;
                case 5:
                    System.out.println("--- Books ---");

`package com.bank.accounts;
import java.util.*;

interface Transactable {
    void deposit(double amt);
    void withdraw(double amt);
    void displayHistory();
}

class Account {
    protected final int accNo; protected final String holderName;
    protected double balance;
    protected static final String BANK = "National Bank";
    static int totalAccounts = 0;

    public Account(int no, String nm, double initBal) {
        if(nm==null||nm.isEmpty()) throw new IllegalArgumentException("Holder name cannot be empty.");
        if(initBal<0) throw new IllegalArgumentException("Initial balance cannot be negative.");
        this.accNo=no; this.holderName=nm; this.balance=initBal; totalAccounts++;
    }
    public void displayAccount() {
        System.out.println("Bank       : " + BANK);
        System.out.println("Acc No     : " + accNo);
        System.out.println("Holder     : " + holderName);
        System.out.printf ("Balance    : Rs.%.2f%n", balance);
    }
}

class Transaction {
    private final String type; private final double amount; private final double balAfter;
    public Transaction(String t, double a, double b) {
        this.type=t;
        this.amount=a;
        this.balAfter=b;
    }
    public String toString() {
        return type+" | Rs."+amount+" | Balance: Rs."+balAfter;
    }
}

class SavingsAccount extends Account implements Transactable {
    private final List<Transaction> history = new ArrayList<>();
    private static final double MIN_BAL = 500.0;

    public SavingsAccount(int no, String nm, double initBal) {
        super(no,nm,initBal);
    }

    @Override public void deposit(double amt) {
        if(amt<=0){ System.out.println("Error: Invalid deposit amount."); return; }
        balance+=amt;
        history.add(new Transaction("DEPOSIT", amt, balance));
        System.out.printf("Deposited Rs.%.2f. New Balance: Rs.%.2f%n", amt, balance);
    }

    @Override public void withdraw(double amt) {
        if(amt<=0){ System.out.println("Error: Invalid withdrawal amount."); return; }
        if(balance-amt < MIN_BAL){
            System.out.printf("Error: Insufficient balance. Min balance Rs.%.2f must be maintained.%n", MIN_BAL); return;
        }
        balance-=amt;
        history.add(new Transaction("WITHDRAW", amt, balance));
        System.out.printf("Withdrawn Rs.%.2f. New Balance: Rs.%.2f%n", amt, balance);
    }

    @Override public void displayHistory() {
        System.out.println("\\n===== TRANSACTION HISTORY =====");
        displayAccount();
        if(history.isEmpty()){ System.out.println("No transactions yet."); return; }
        for(int i=0;i<history.size();i++) System.out.println((i+1)+". "+history.get(i));
        System.out.println("================================");
    }
}

public class BankingSystem {
    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in); SavingsAccount acc = null; int choice;
        do {
            System.out.println("\\n====== BANKING SYSTEM ======");
            System.out.println("1. Create Account  2. Deposit  3. Withdraw  4. Balance  5. History  6. Total Accounts  7. Exit");
            System.out.print("Enter Choice: "); choice = sc.nextInt();
            switch(choice) {
                case 1:
                    try {
                        sc.nextLine();
                        System.out.print("Account No: "); int no=sc.nextInt(); sc.nextLine();
                        System.out.print("Holder Name: "); String nm=sc.nextLine();
                        System.out.print("Initial Balance: "); double bal=sc.nextDouble();
                        acc=new SavingsAccount(no,nm,bal); System.out.println("Account Created!");
                    } catch(IllegalArgumentException e){ System.out.println("Error: "+e.getMessage()); }
                    break;
                case 2: if(acc==null){System.out.println("Create account first!");break;} System.out.print("Amount: "); acc.deposit(sc.nextDouble()); break;
                case 3: if(acc==null){System.out.println("Create account first!");break;} System.out.print("Amount: "); acc.withdraw(sc.nextDouble()); break;
                case 4: if(acc!=null) acc.displayAccount(); else System.out.println("No account!"); break;

interface Storable {

class Item {
    private final int itemCode; private final String itemName;
    private int quantity; private final double price;
    private static final int REORDER_LEVEL = 10;
    static int totalItems = 0;

    public Item(int code, String name, int qty, double price) {
        if(name==null||name.isEmpty()) throw new IllegalArgumentException("Item name cannot be empty.");
        if(qty<0)    throw new IllegalArgumentException("Quantity cannot be negative.");
        if(price<0)  throw new IllegalArgumentException("Price cannot be negative.");
        this.itemCode=code; this.itemName=name; this.quantity=qty; this.price=price; totalItems++;
    }
    public int getCode() {
        return itemCode;
    }
    public int getQuantity() {
        return quantity;
    }
    public void setQuantity(int q) {
        this.quantity=q;
    }
    public void display() {
        System.out.println("Code: "+itemCode+" | Name: "+itemName+" | Qty: "+quantity+" | Price: Rs."+price
                +(quantity<=REORDER_LEVEL?" [*** REORDER ALERT ***]":""));
    }
}

class Inventory implements Storable {
    private final List<Item> items = new ArrayList<>();
    private Item selected = null;

    public void selectItem(int code){
        selected=null; for(Item i:items) if(i.getCode()==code){ selected=i; break; }
        if(selected==null) System.out.println("Item code "+code+" not found.");
        else System.out.println("Selected: "+code);
    }

    public boolean addItem(Item item) {
        for(Item i:items) if(i.getCode()==item.getCode()){ System.out.println("Error: Duplicate item code!"); return false; }
        items.add(item); System.out.println("Item added."); return true;
    }

    @Override public void addStock(int qty){
        if(selected==null){System.out.println("Select item first!");return;}
        if(qty<=0){System.out.println("Qty must be positive.");return;}
        selected.setQuantity(selected.getQuantity()+qty); System.out.println("Stock added. New Qty: "+selected.getQuantity());
    }

    @Override public void removeStock(int qty){
        if(selected==null){System.out.println("Select item first!");return;}
        if(qty<=0){System.out.println("Qty must be positive.");return;}
        if(qty>selected.getQuantity()){System.out.println("Error: Stock underflow! Available: "+selected.getQuantity());return;}
        selected.setQuantity(selected.getQuantity()-qty); System.out.println("Stock removed. New Qty: "+selected.getQuantity());
    }

    @Override public int getStock() {
        return selected!=null ? selected.getQuantity() : -1;
    }

    public void displayAll(){
        if(items.isEmpty()){System.out.println("No items in inventory.");return;}
        System.out.println("\\n===== INVENTORY =====");
        for(Item i:items) i.display();
        System.out.println("=====================");
    }
}

        this.patientId=pid; this.name=nm; this.age=age; totalPatients++;

    private static final int MAX_SLOTS = 5;
    static int totalAppointments = 0;

    public Appointment(int id, String nm, String spec) {
        super(id,nm,spec);
        Arrays.fill(slots,null);
    }

    public void displaySlots(){
        displayDoctor();
        System.out.println("--- Available Slots (1-"+MAX_SLOTS+") ---");
        for(int i=0;i<MAX_SLOTS;i++) System.out.println("Slot "+(i+1)+": "+(slots[i]==null?"Available":slots[i]));
    }

    @Override public boolean bookAppointment(String patientName, int slot){
        if(slot<1||slot>MAX_SLOTS){ System.out.println("Error: Invalid time slot."); return false; }
        if(slots[slot-1]!=null){ System.out.println("Error: Slot "+slot+" already booked! (Overlapping appointment)"); return false; }
        if(patientName==null||patientName.isEmpty()){ System.out.println("Error: Null/empty patient info."); return false; }
        slots[slot-1]=patientName; totalAppointments++;
        System.out.println("Appointment booked for "+patientName+" at Slot "+slot); return true;
    }

    @Override public boolean cancelAppointment(int slot){
        if(slot<1||slot>MAX_SLOTS){ System.out.println("Error: Invalid slot."); return false; }
        if(slots[slot-1]==null){ System.out.println("No appointment at Slot "+slot); return false; }
        System.out.println("Appointment of "+slots[slot-1]+" at Slot "+slot+" cancelled.");
        slots[slot-1]=null; return true;
    }
}

class Airline {
    protected static final String AIRLINE_NAME = "Sky Wings Airlines";
    public void displayAirline() {
        System.out.println("Airline: " + AIRLINE_NAME);
    }
}

class Flight extends Airline {
    protected final String flightNo; protected final String source; protected final String destination;
    protected final int totalSeats; protected int availSeats;
    static int totalFlights = 0;

    public Flight(String fno, String src, String dest, int seats){
        if(seats<=0) throw new IllegalArgumentException("Seats must be positive.");
        this.flightNo=fno; this.source=src; this.destination=dest;
        this.totalSeats=seats; this.availSeats=seats; totalFlights++;
    }
    public void displayFlight(){
        displayAirline();
        System.out.println("Flight: "+flightNo+" | "+source+" -> "+destination+" | Seats Avail: "+availSeats+"/"+totalSeats);
    }
}

class Passenger extends Airline {
    protected final String passengerId; protected final String name; protected final int age;
    static int totalPassengers = 0;
    public Passenger(String pid, String nm, int ag){
        if(nm==null||nm.isEmpty()) throw new IllegalArgumentException("Passenger name cannot be empty.");
        if(ag<2||ag>120) throw new IllegalArgumentException("Invalid passenger age.");
        this.passengerId=pid; this.name=nm; this.age=ag; totalPassengers++;
    }
    public void display() {
        System.out.println("Passenger: "+passengerId+" | "+name+" | Age: "+age);
    }
}

class Ticket extends Flight implements CheckIn {
    private final Map<String,String> bookedSeats = new HashMap<>();
    private final double farePerSeat;
    static int totalTickets = 0;

    public Ticket(String fno, String src, String dest, int seats, double fare){
        super(fno,src,dest,seats);
        if(fare<0) throw new IllegalArgumentException("Fare cannot be negative.");
        this.farePerSeat=fare;
    }

    @Override public boolean checkIn(String passengerId){
        if(bookedSeats.containsKey(passengerId)){ System.out.println("Error: Double booking! Passenger already has a ticket."); return false; }
        if(availSeats<=0){ System.out.println("Error: Flight overbooked! No seats available."); return false; }
        String seatNo = "S"+(totalSeats-availSeats+1);
        bookedSeats.put(passengerId, seatNo); availSeats--; totalTickets++;
        System.out.println("CheckIn successful! Seat: "+seatNo+" | Fare: Rs."+farePerSeat);
        return true;
    }

    @Override public boolean cancelTicket(String passengerId){

`package com.quiz.app;
import java.util.*;

interface Scorable {
    int calculateScore();
    void displayResult();
}

class Question {
    private final int qId; private final String qText;
    private final String[] options; private final int correctOption;
    static int totalQuestions = 0;

    public Question(int id, String text, String[] opts, int correct){
        if(opts.length!=4) throw new IllegalArgumentException("Must have exactly 4 options.");
        if(correct<1||correct>4) throw new IllegalArgumentException("Correct option must be 1-4.");
        this.qId=id; this.qText=text; this.options=opts; this.correctOption=correct; totalQuestions++;
    }
    public void display(){
        System.out.println("Q"+qId+": "+qText);
        for(int i=0;i<options.length;i++) System.out.println("  "+(i+1)+". "+options[i]);
    }
    public boolean checkAnswer(int ans) {
        return ans==correctOption;
    }
}

class User {
    protected final String userId; protected final String userName;
    static int totalUsers = 0;
    public User(String id, String nm){
        if(nm==null||nm.isEmpty()) throw new IllegalArgumentException("Username cannot be empty.");
        this.userId=id; this.userName=nm; totalUsers++;
    }
}

class Quiz extends User implements Scorable {
    private final List<Question> questions = new ArrayList<>();
    private final int[] userAnswers;
    private int score = 0; private boolean attempted = false;
    private static final int MAX_QUESTIONS = 5;

    public Quiz(String id, String nm) {
        super(id,nm);
        this.userAnswers=new int[MAX_QUESTIONS];
    }

    public void addQuestion(Question q){
        if(questions.size()>=MAX_QUESTIONS){ System.out.println("Max "+MAX_QUESTIONS+" questions allowed!"); return; }
        questions.add(q); System.out.println("Question added.");
    }

    public void startQuiz(Scanner sc){
        if(questions.isEmpty()){ System.out.println("No questions added!"); return; }
        System.out.println("\\n===== QUIZ STARTED: "+userName+" =====");
        score=0;
        for(int i=0;i<questions.size();i++){
            questions.get(i).display();
            System.out.print("Your Answer (1-4): ");
            int ans;
            try{ ans=sc.nextInt(); if(ans<1||ans>4) throw new InputMismatchException(); }
            catch(Exception e){ System.out.println("Invalid input format! Marking as 0."); sc.nextLine(); ans=0; }
            userAnswers[i]=ans;
            if(ans!=0&&questions.get(i).checkAnswer(ans)) score++;
        }
        attempted=true; System.out.println("Quiz submitted!");
    }

    @Override public int calculateScore() {
        return score;
    }

    @Override public void displayResult(){
        if(!attempted){ System.out.println("Quiz not attempted yet!"); return; }
        int total=questions.size();
        System.out.println("\\n===== QUIZ RESULT =====");
        System.out.println("User   : "+userName);
        System.out.println("Score  : "+score+"/"+total);
        System.out.println("Grade  : "+(score==total?"A+ (Perfect)":score>=(total*0.7)?"A (Pass)":"F (Fail)"));
        System.out.println("=======================");
    }
}

public class OnlineQuizSystem {

        Scanner sc=new Scanner(System.in); Quiz quiz=null; int choice;

            System.out.println("\\n====== ONLINE QUIZ SYSTEM ======");
            System.out.println("1. Create User  2. Add Question  3. Start Quiz  4. View Result  5. Stats  6. Exit");
            System.out.print("Enter Choice: "); choice=sc.nextInt();

class Product extends FeedbackEntity implements Reviewable {
    private final int productId; private final String productName;
    private final List<Feedback> reviews = new ArrayList<>();
    private final Set<String> reviewedBy = new HashSet<>();
    static int totalProducts = 0;

    public Product(int id, String nm){
        if(nm==null||nm.isEmpty()) throw new IllegalArgumentException("Product name cannot be empty.");
        this.productId=id; this.productName=nm; totalProducts++;
    }

    @Override public void addReview(String cid, int rating, String comment){
        if(reviewedBy.contains(cid)){ System.out.println("Error: Duplicate feedback! Customer already reviewed this product."); return; }
        reviews.add(new Feedback(cid,rating,comment)); reviewedBy.add(cid);
        System.out.println("Review added! Rating: "+rating+"/5");
    }

    @Override public double getAverageRating(){
        if(reviews.isEmpty()) return 0;
        int sum=0; for(Feedback f:reviews) sum+=f.getRating(); return (double)sum/reviews.size();
    }

        displayPlatform();

`package com.parcel.tracking;
import java.util.*;

interface Trackable {
    void updateStatus(String location, String status);
    String getTrackingInfo();
}

class TrackingEntity {
    protected static final String COURIER_NAME = "SwiftPost Logistics";
    public void displayCourier() {
        System.out.println("Courier: " + COURIER_NAME);
    }
}

class Location {
    private final String city; private final String state;
    public Location(String city, String state){
        if(city==null||city.isEmpty()) throw new IllegalArgumentException("City cannot be empty.");
        this.city=city; this.state=state;
    }
    public String toString() {
        return city+", "+state;
    }
}

class Parcel extends TrackingEntity implements Trackable {
    private final String trackingNo; private final String senderName; private final String receiverName;
    private final double weightKg;
    private String currentStatus = "BOOKED";
    private Location currentLocation;
    private final List<String> history = new ArrayList<>();
    static int totalParcels = 0;

    public Parcel(String tno, String sender, String receiver, double weight){
        if(tno==null||tno.isEmpty()) throw new IllegalArgumentException("Tracking number cannot be empty.");
        if(weight<=0) throw new IllegalArgumentException("Weight must be positive.");
        this.trackingNo=tno; this.senderName=sender; this.receiverName=receiver; this.weightKg=weight;
        history.add("BOOKED at origin."); totalParcels++;
    }

    @Override public void updateStatus(String loc, String status){
        if(loc==null||loc.isEmpty()) throw new IllegalArgumentException("Missing location update!");
        if(status==null||status.isEmpty()) throw new IllegalArgumentException("Status cannot be empty.");
        String[] parts=loc.split(",");
        this.currentLocation=new Location(parts[0].trim(), parts.length>1?parts[1].trim():"N/A");
        this.currentStatus=status;
        String entry=status+" at "+currentLocation;
        if(history.contains(entry)){ System.out.println("Duplicate status update ignored."); return; }
        history.add(entry); System.out.println("Status updated: "+entry);
    }

    @Override public String getTrackingInfo(){
        return "Tracking No: "+trackingNo+" | Status: "+currentStatus
                +" | Location: "+(currentLocation!=null?currentLocation:"Origin")
                +" | Weight: "+weightKg+"kg";
    }

    public void displayFull(){
        displayCourier();
        System.out.println("Tracking No : "+trackingNo);
        System.out.println("Sender      : "+senderName);
        System.out.println("Receiver    : "+receiverName);
        System.out.println("Weight      : "+weightKg+" kg");
        System.out.println("Status      : "+currentStatus);
        System.out.println("Location    : "+(currentLocation!=null?currentLocation:"Origin"));
        System.out.println("--- History ---");
        for(String h:history) System.out.println(" > "+h);
    }
}

`package com.utility.billing;
import java.util.Scanner;

interface Billable {
    double calculateBill();
    void displayBill();
}

class UtilityEntity {
    protected static final String UTILITY = "Maharashtra State Electricity Board";
    public void displayUtility() {
        System.out.println("Utility: " + UTILITY);
    }
}

class Meter extends UtilityEntity {
    protected final String meterId; protected double prevReading; protected double currReading;
    static int totalMeters = 0;

    public Meter(String id, double prev, double curr){
        if(id==null||id.isEmpty()) throw new IllegalArgumentException("Meter ID cannot be empty.");
        if(prev<0||curr<0) throw new IllegalArgumentException("Meter readings cannot be negative.");
        if(curr<prev) throw new IllegalArgumentException("Current reading cannot be less than previous reading.");
        this.meterId=id; this.prevReading=prev; this.currReading=curr; totalMeters++;
    }
    public double getUnitsConsumed() {
        return currReading - prevReading;
    }
}

class Customer extends Meter {
    private final int custId; private final String custName;
    static int totalCustomers = 0;
    public Customer(int id, String nm, String mId, double prev, double curr){
        super(mId,prev,curr);
        if(nm==null||nm.isEmpty()) throw new IllegalArgumentException("Customer name cannot be empty.");
        this.custId=id; this.custName=nm; totalCustomers++;
    }
    public void displayCustomer(){
        displayUtility();
        System.out.println("Customer ID: "+custId+" | Name: "+custName+" | Meter: "+meterId);
        System.out.println("Prev Reading: "+prevReading+" | Curr Reading: "+currReading+" | Units: "+getUnitsConsumed());
    }
}

class Bill extends Customer implements Billable {
    static int totalBills = 0;

    public Bill(int id, String nm, String mId, double prev, double curr){
        super(id,nm,mId,prev,curr); totalBills++;
    }

    @Override public double calculateBill(){
        double units = getUnitsConsumed();
        if(units<0) throw new ArithmeticException("Invalid units consumed!");
        double charge = 0;
        // Slab-based billing
        if(units<=100)       charge = units * 1.50;
        else if(units<=300)  charge = 100*1.50 + (units-100)*2.50;
        else if(units<=500)  charge = 100*1.50 + 200*2.50 + (units-300)*4.00;
        else                 charge = 100*1.50 + 200*2.50 + 200*4.00 + (units-500)*6.00;
        return charge;
    }

    @Override public void displayBill(){
        System.out.println("\\n========== ELECTRICITY BILL ==========");
        displayCustomer();
        double units=getUnitsConsumed(), charge=calculateBill();
        System.out.println("Slab: "+(units<=100?"0-100 units @Rs.1.50":units<=300?"101-300 units @Rs.2.50":units<=500?"301-500 @Rs.4.00":"500+ @Rs.6.00"));

import java.util.*;

interface Schedulable {

}

class EventEntity {

    public void displayCompany() {
        System.out.println("Company: " + COMPANY);
    }
}

class Venue extends EventEntity {
    protected final String venueId; protected final String venueName; protected final int capacity;
    protected final List<String> bookedDates = new ArrayList<>();
    static int totalVenues = 0;

    public Venue(String id, String nm, int cap){
        if(nm==null||nm.isEmpty()) throw new IllegalArgumentException("Venue name cannot be empty.");
        if(cap<=0) throw new IllegalArgumentException("Capacity must be positive.");
        this.venueId=id; this.venueName=nm; this.capacity=cap; totalVenues++;
    }
    public void display() {
        displayCompany();
        System.out.println("Venue: "+venueName+" | ID: "+venueId+" | Capacity: "+capacity);
    }
}

class Attendee extends EventEntity {
    protected final String attendeeId; protected final String attendeeName;
    static int totalAttendees = 0;
    public Attendee(String id, String nm){
        if(nm==null||nm.isEmpty()) throw new IllegalArgumentException("Attendee name cannot be empty.");
        this.attendeeId=id; this.attendeeName=nm; totalAttendees++;
    }
}

class Event extends Venue implements Schedulable {
    private final String eventId; private final String eventName;
    private final List<String> attendees = new ArrayList<>();
    private final int maxAttendees;
    private final Map<String,String> schedule = new HashMap<>();
    static int totalEvents = 0;

    public Event(String eid, String enm, String vid, String vnm, int vcap, int maxAtt){
        super(vid,vnm,vcap);
        if(enm==null||enm.isEmpty()) throw new IllegalArgumentException("Event name cannot be empty.");
        if(maxAtt>vcap) throw new IllegalArgumentException("Max attendees cannot exceed venue capacity.");
        this.eventId=eid; this.eventName=enm; this.maxAttendees=maxAtt; totalEvents++;
    }

    @Override public boolean scheduleEvent(String date, String time){
        if(date==null||date.isEmpty()) throw new IllegalArgumentException("Invalid date!");
        if(!isAvailable(date)){ System.out.println("Error: Venue already booked on "+date+"!"); return false; }
        schedule.put(date,time); bookedDates.add(date);
        System.out.println("Event '"+eventName+"' scheduled on "+date+" at "+time); return true;
    }

    @Override public boolean isAvailable(String date) {
        return !bookedDates.contains(date);
    }

    public void addAttendee(String name){
        if(attendees.size()>=maxAttendees){ System.out.println("Error: Event overbooking! Max attendees reached."); return; }
        if(attendees.contains(name)){ System.out.println("Error: Double booking! "+name+" already registered."); return; }
        attendees.add(name); System.out.println(name+" registered for "+eventName);
    }

    public void displayEvent(){
        display();
        System.out.println("Event: "+eventName+" | ID: "+eventId+" | Attendees: "+attendees.size()+"/"+maxAttendees);
        System.out.println("Schedule: "+schedule);
        System.out.println("Registered: "+attendees);
    }
}

        Scanner sc=new Scanner(System.in); Event event=null; int choice;

class HotelEntity {

        System.out.println("Hotel: " + HOTEL);
    }
}

class Customer extends HotelEntity {
    protected final String custId; protected final String custName; protected final String phone;
    static int totalCustomers = 0;
    public Customer(String id, String nm, String ph){
        if(nm==null||nm.isEmpty()) throw new IllegalArgumentException("Customer name cannot be empty.");
        if(ph==null||ph.length()!=10) throw new IllegalArgumentException("Invalid phone number (must be 10 digits).");
        this.custId=id; this.custName=nm; this.phone=ph; totalCustomers++;
    }
    public String getId() {
        return custId;
    }
    public String getName() {
        return custName;
    }
    public void display() {
        displayHotel();
        System.out.println("Customer: "+custId+" | "+custName+" | Phone: "+phone);
    }
}

class Room extends HotelEntity implements Bookable {
    private final int roomNo; private final String roomType; private final double pricePerNight;
    private boolean available = true;
    private final Map<String,Integer> bookings = new HashMap<>();
    static int totalRooms = 0;

    public Room(int no, String type, double price){
        if(price<0) throw new IllegalArgumentException("Price cannot be negative.");
        this.roomNo=no; this.roomType=type; this.pricePerNight=price; totalRooms++;
    }

    @Override public boolean bookRoom(String custId, int nights){
        if(!available){ System.out.println("Error: Room "+roomNo+" not available!"); return false; }
        if(nights<=0){ System.out.println("Error: Invalid number of nights."); return false; }
        if(custId==null||custId.isEmpty()){ System.out.println("Error: Invalid customer info."); return false; }
        available=false; bookings.put(custId,nights);
        System.out.printf("Room %d (%s) booked for %s. Nights: %d | Total: Rs.%.2f%n",
                roomNo,roomType,custId,nights,pricePerNight*nights);
        return true;
    }

    @Override public boolean checkOut(String custId){
        if(!bookings.containsKey(custId)){ System.out.println("No booking found for "+custId); return false; }
        int nights=bookings.remove(custId); available=true;
        System.out.printf("Checkout successful! Room %d | %d nights | Bill: Rs.%.2f%n",roomNo,nights,pricePerNight*nights);
        return true;
    }

    public void display(){
        displayHotel();
        System.out.println("Room: "+roomNo+" | Type: "+roomType+" | Price: Rs."+pricePerNight+"/night | Status: "+(available?"Available":"Booked"));
    }
}

        if(ag<18||ag>65) throw new IllegalArgumentException("Age must be between 18 and 65.");

class Loan extends Applicant implements Eligible {
    private final String loanType; private final double loanAmount; private final int tenure;
    static int totalLoans = 0;

    public Loan(String nm, int ag, double inc, String emp, int cs, String lt, double amt, int ten){
        super(nm,ag,inc,emp,cs);
        if(amt<=0) throw new IllegalArgumentException("Loan amount must be positive.");
        if(ten<1) throw new IllegalArgumentException("Tenure must be at least 1 year.");
        this.loanType=lt; this.loanAmount=amt; this.tenure=ten; totalLoans++;
    }

    @Override public boolean checkEligibility(){
        if(score<600){ System.out.println("Reason: Credit score below 600."); return false; }
        if(monthlyIncome<15000){ System.out.println("Reason: Income below Rs.15,000/month."); return false; }
        double emi = (loanAmount/tenure)/12;
        if(emi > monthlyIncome*0.4){ System.out.println("Reason: EMI exceeds 40% of monthly income."); return false; }
        return true;
    }

    @Override public void displayResult(){
        System.out.println("\\n========== LOAN ELIGIBILITY REPORT ==========");

        System.out.println("Loan Type     : " + loanType);
        System.out.printf ("Loan Amount   : Rs.%.2f%n", loanAmount);
        System.out.println("Tenure        : " + tenure + " years");

        System.out.println("Eligibility   : " + (checkEligibility() ? "APPROVED" : "REJECTED"));

`package com.weather.app;
import java.util.Scanner;

interface Forecastable {
    double getAvgTemperature();
    double getAvgHumidity();
    void displayForecast();
}

class WeatherEntity {
    protected static final String SERVICE = "SkyWatch Weather Service";
    public void displayService() {
        System.out.println("Service: " + SERVICE);
    }
}

class City extends WeatherEntity {
    protected final String cityName; protected final String state;
    static int totalCities = 0;
    public City(String nm, String st){
        if(nm==null||nm.isEmpty()) throw new IllegalArgumentException("City name cannot be empty.");
        this.cityName=nm; this.state=st; totalCities++;
    }
    public void displayCity() {
        displayService();
        System.out.println("City: "+cityName+", "+state);
    }
}

class WeatherData extends City {
    protected final double[] temperatures; protected final double[] humidity;
    protected final int days;

    public WeatherData(String nm, String st, double[] temps, double[] hum){
        super(nm,st);
        if(temps==null||temps.length==0) throw new IllegalArgumentException("Temperature data missing.");
        if(hum==null||hum.length!=temps.length) throw new IllegalArgumentException("Humidity data mismatch.");
        for(double t:temps) if(t<-100||t>70) throw new IllegalArgumentException("Invalid temperature value: "+t);
        this.temperatures=temps; this.humidity=hum; this.days=temps.length;
    }
}

class Forecast extends WeatherData implements Forecastable {
    static int totalForecasts = 0;
    public Forecast(String nm, String st, double[] temps, double[] hum) {
        super(nm,st,temps,hum);
        totalForecasts++;
    }

    @Override public double getAvgTemperature(){
        double sum=0; for(double t:temperatures) sum+=t; return sum/days;
    }

    @Override public double getAvgHumidity(){
        double sum=0; for(double h:humidity) sum+=h; return sum/days;
    }

    private String getCondition(double temp){
        if(temp>38) return "Very Hot"; if(temp>30) return "Hot";
        if(temp>20) return "Pleasant"; if(temp>10) return "Cool"; return "Cold";
    }

    @Override public void displayForecast(){
        System.out.println("\\n========== WEATHER FORECAST ==========");
        displayCity();
        System.out.println("Forecast Period: "+days+" Days");
        System.out.println("--- Daily Data ---");
        for(int i=0;i<days;i++) System.out.printf("Day %2d: Temp=%.1f°C | Humidity=%.1f%%%n",i+1,temperatures[i],humidity[i]);
        System.out.println("--- Summary ---");
        double avgT=getAvgTemperature(), avgH=getAvgHumidity();
        System.out.printf("Avg Temperature: %.2f°C%n", avgT);
        System.out.printf("Avg Humidity   : %.2f%%%n", avgH);
        System.out.printf("Max Temp       : %.1f°C%n", java.util.Arrays.stream(temperatures).max().getAsDouble());
        System.out.printf("Min Temp       : %.1f°C%n", java.util.Arrays.stream(temperatures).min().getAsDouble());
        System.out.println("Condition      : "+getCondition(avgT));
        System.out.println("======================================");
    }
}

public class WeatherForecastingApp {
    public static void main(String[] args){
        Scanner sc=new Scanner(System.in); Forecast forecast=null; int choice;
        do{
            System.out.println("\\n====== WEATHER FORECASTING APPLICATION ======");
            System.out.println("1. Add Weather Data  2. Display Forecast  3. Total Forecasts  4. Exit");
            System.out.print("Enter Choice: "); choice=sc.nextInt();
            switch(choice){
                case 1:
                    try{
                        sc.nextLine();
                        System.out.print("City: "); String city=sc.nextLine();
                        System.out.print("State: "); String state=sc.nextLine();
                        System.out.print("Number of Days: "); int d=sc.nextInt();
                        if(d<=0) throw new IllegalArgumentException("Days must be positive.");
                        double[] temps=new double[d], hum=new double[d];
                        for(int i=0;i<d;i++){
                            System.out.print("Day "+(i+1)+" Temp (°C): "); temps[i]=sc.nextDouble();
                            System.out.print("Day "+(i+1)+" Humidity (%): "); hum[i]=sc.nextDouble();
                        }
                        forecast=new Forecast(city,state,temps,hum); System.out.println("Data added!");
                    }catch(IllegalArgumentException e){System.out.println("Error: "+e.getMessage());}
                    catch(Exception e){System.out.println("Invalid Input!"); sc.nextLine();}

                case 2: if(forecast!=null) forecast.displayForecast(); else System.out.println("Add data first!"); break;

            txtPhone.setText("");

            int confirm = JOptionPane.showConfirmDialog(this, "Exit application?", "Confirm", JOptionPane.YES_NO_OPTION);
            if (confirm == JOptionPane.YES_OPTION) System.exit(0);
        }
    }

`import java.sql.*;
import java.util.Scanner;

// SETUP: Create DB first by running this SQL:
// CREATE DATABASE college_db;
// USE college_db;

public class JDBCCRUDOperations {

    // ---- Database Connection ----
    static Connection getConnection() throws SQLException {
        return DriverManager.getConnection(
            "jdbc:mysql://localhost:3306/college_db",
            "root",
            "your_password"
        );
    }

    // ---- Create Table ----
    static void createTable() {
        String sql = "CREATE TABLE IF NOT EXISTS students ("
                   + "id INT PRIMARY KEY AUTO_INCREMENT, "
                   + "name VARCHAR(100) NOT NULL, "
                   + "course VARCHAR(100), "
                   + "marks DOUBLE, "
                   + "phone VARCHAR(15))";
        try (Connection con = getConnection(); Statement st = con.createStatement()) {
            st.executeUpdate(sql);
            System.out.println("Table 'students' created (or already exists).");
        } catch (SQLException e) { System.out.println("Error: " + e.getMessage()); }
    }

    // ---- INSERT ----
    static void insertStudent(String name, String course, double marks, String phone) {
        String sql = "INSERT INTO students (name, course, marks, phone) VALUES (?, ?, ?, ?)";
        try (Connection con = getConnection(); PreparedStatement ps = con.prepareStatement(sql)) {
            ps.setString(1, name);
            ps.setString(2, course);
            ps.setDouble(3, marks);
            ps.setString(4, phone);
            int rows = ps.executeUpdate();
            System.out.println(rows + " row(s) inserted. Student: " + name);
        } catch (SQLException e) { System.out.println("Insert Error: " + e.getMessage()); }
    }

    // ---- SELECT ALL ----
    static void selectAll() {
        String sql = "SELECT * FROM students";
        try (Connection con = getConnection(); Statement st = con.createStatement();
             ResultSet rs = st.executeQuery(sql)) {
            System.out.println("\\n===== STUDENTS TABLE =====");
            System.out.printf("%-5s %-20s %-15s %-8s %-12s%n","ID","Name","Course","Marks","Phone");
            System.out.println("-".repeat(65));
            while (rs.next()) {
                System.out.printf("%-5d %-20s %-15s %-8.2f %-12s%n",
                    rs.getInt("id"), rs.getString("name"),
                    rs.getString("course"), rs.getDouble("marks"), rs.getString("phone"));
            }
            System.out.println("==========================");
        } catch (SQLException e) { System.out.println("Select Error: " + e.getMessage()); }
    }

    // ---- SELECT BY ID ----
    static void selectById(int id) {
        String sql = "SELECT * FROM students WHERE id = ?";
        try (Connection con = getConnection(); PreparedStatement ps = con.prepareStatement(sql)) {
            ps.setInt(1, id);
            ResultSet rs = ps.executeQuery();
            if (rs.next()) {
                System.out.println("ID: "+rs.getInt("id")+" | Name: "+rs.getString("name")
                    +" | Course: "+rs.getString("course")+" | Marks: "+rs.getDouble("marks")
                    +" | Phone: "+rs.getString("phone"));
            } else { System.out.println("Student ID "+id+" not found."); }
        } catch (SQLException e) { System.out.println("Error: " + e.getMessage()); }
    }

    // ---- UPDATE ----
    static void updateMarks(int id, double newMarks) {
        String sql = "UPDATE students SET marks = ? WHERE id = ?";
        try (Connection con = getConnection(); PreparedStatement ps = con.prepareStatement(sql)) {
            ps.setDouble(1, newMarks);
            ps.setInt(2, id);
            int rows = ps.executeUpdate();
            if (rows > 0) System.out.println("Marks updated for ID: " + id);
            else System.out.println("Student ID " + id + " not found.");
        } catch (SQLException e) { System.out.println("Update Error: " + e.getMessage()); }
    }

    // ---- DELETE ----
    static void deleteStudent(int id) {
        String sql = "DELETE FROM students WHERE id = ?";
        try (Connection con = getConnection(); PreparedStatement ps = con.prepareStatement(sql)) {
            ps.setInt(1, id);
            int rows = ps.executeUpdate();
            if (rows > 0) System.out.println("Student ID " + id + " deleted.");
            else System.out.println("Student ID " + id + " not found.");
        } catch (SQLException e) { System.out.println("Delete Error: " + e.getMessage()); }
    }

    // ---- MAIN MENU ----
    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in); int choice;

        // Load MySQL Driver (JDBC 4.0+ auto-loads, but explicit for clarity)
        try { Class.forName("com.mysql.cj.jdbc.Driver"); }
        catch (ClassNotFoundException e) { System.out.println("MySQL Driver not found!"); return; }

        createTable(); // Create table on startup

        do {
            System.out.println("\\n====== JDBC CRUD OPERATIONS ======");
            System.out.println("1. Insert Student");
            System.out.println("2. Select All Students");
            System.out.println("3. Select Student by ID");
            System.out.println("4. Update Marks");
            System.out.println("5. Delete Student");
            System.out.println("6. Exit");
            System.out.print("Enter Choice: "); choice = sc.nextInt();

            switch (choice) {
                case 1:
                    sc.nextLine();
                    System.out.print("Name: "); String nm = sc.nextLine();
                    System.out.print("Course: "); String crs = sc.nextLine();
                    System.out.print("Marks: "); double mk = sc.nextDouble();
                    sc.nextLine();
                    System.out.print("Phone: "); String ph = sc.nextLine();
                    insertStudent(nm, crs, mk, ph);
                    break;
                case 2: selectAll(); break;
                case 3:
                    System.out.print("Enter ID: "); selectById(sc.nextInt()); break;
                case 4:
                    System.out.print("Enter ID: "); int uid = sc.nextInt();
                    System.out.print("New Marks: "); double umk = sc.nextDouble();
                    updateMarks(uid, umk); break;
                case 5:
                    System.out.print("Enter ID to delete: "); deleteStudent(sc.nextInt()); break;
                case 6: System.out.println("Exiting..."); break;
                default: System.out.println("Invalid Choice!");
            }
        } while (choice != 6);
        sc.close();
    }
}`

function hl(text,q){
  if(!q) return escHtml(text);
  const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  return escHtml(text).replace(re,'<mark>$1</mark>');
}
function escHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function toggle(header){
  const body=header.nextElementSibling;
  const icon=header.querySelector('.ci');
  const isOpen=!body.classList.contains('hidden');
  body.classList.toggle('hidden');
  icon.style.transform=isOpen?'':'rotate(180deg)';
}

function copyCode(btn){
  const pre=btn.closest('.card').querySelector('pre');
  const text=pre.textContent;
  const originalHtml = btn.innerHTML;
  navigator.clipboard.writeText(text).then(()=>{
    btn.innerHTML='<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Copied!';
    btn.className='bg-black text-white border border-black px-3 py-1.5 rounded-md text-xs font-medium flex items-center gap-1.5 transition-colors flex-shrink-0 z-10 w-fit shadow-sm';
    setTimeout(()=>{ btn.innerHTML=originalHtml; btn.className='bg-white hover:bg-gray-50 text-gray-700 border border-gray-200 px-3 py-1.5 rounded-md text-xs font-medium flex items-center gap-1.5 transition-colors flex-shrink-0 z-10 w-fit shadow-sm'; },2000);
  }).catch(()=>{ btn.innerHTML='❌ Failed'; setTimeout(()=>btn.innerHTML=originalHtml,2000); });
}

function copyCodeInner(btn){
  const pre=btn.closest('.rounded-lg').querySelector('pre');
  const text=pre.textContent;
  const originalHtml = btn.innerHTML;
  navigator.clipboard.writeText(text).then(()=>{
    btn.innerHTML='<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Copied!';
    btn.classList.add('text-green-400');
    setTimeout(()=>{ btn.innerHTML=originalHtml; btn.classList.remove('text-green-400'); },2000);
  }).catch(()=>{ btn.innerHTML='❌ Failed'; setTimeout(()=>btn.innerHTML=originalHtml,2000); });
}
